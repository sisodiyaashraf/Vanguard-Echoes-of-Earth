name: vanguard_echoes_of_earth
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.35.1
  shared_preferences: ^2.2.0
  flame_audio: ^2.1.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/images/backgrounds/
    - assets/app_icon/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/app_icon.jpg"
  web:
    generate: true
    image_path: "assets/app_icon/app_icon.jpg"
  windows:
    generate: true
    image_path: "assets/app_icon/app_icon.jpg"
  macos:
    generate: true
    image_path: "assets/app_icon/app_icon.jpg"
